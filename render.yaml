# Render.com 一键部署（免费套餐可用）
# 用法：把仓库推到 GitHub 后在 Render 里选 "Blueprint"，它会读取本文件。
services:
  - type: web
    name: minecraft-law-site
    runtime: node
    plan: free
    # 无第三方依赖；build 只做一次产物自检，失败会直接中止部署
    buildCommand: "npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # 大模型增强（可选）：在 Render 后台的 Environment 里手动添加即可，
      # 不添加则使用内置的离线条文检索引擎，功能完整。
      #   LAW_LLM_API_KEY / LAW_LLM_BASE_URL / LAW_LLM_MODEL
